<aside
  class="h-full bg-white border-r border-slate-200/90 flex flex-col justify-between transition-[width] duration-200 ease-in-out select-none"
  [class.w-60]="!isCollapsed()"
  [class.w-[70px]]="isCollapsed()"
  aria-label="Sidebar Navigation"
>
  <!-- Top Navigation Items -->
  <div class="pr-2 py-2 space-y-1.5 overflow-y-auto min-h-0 flex-1">
    @for (item of navItems; track item.id) {
      <a
        [routerLink]="item.route"
        routerLinkActive="drawer-active"
        [routerLinkActiveOptions]="{ exact: item.id === 'dashboard' }"
        (click)="selectTab(item.id)"
        [matTooltip]="item.label"
        matTooltipPosition="right"
        [matTooltipDisabled]="!isCollapsed()"
        [title]="item.label"
        class="drawer-item group flex items-center cursor-pointer outline-none transition-colors"
        [class.px-3.5]="!isCollapsed()"
        [class.py-2.5]="!isCollapsed()"
        [class.gap-3]="!isCollapsed()"
        [class.w-11]="isCollapsed()"
        [class.h-11]="isCollapsed()"
        [class.mx-auto]="isCollapsed()"
        [class.justify-center]="isCollapsed()"
      >
        <!-- Clean Outline Icon -->
        <span class="shrink-0 flex items-center justify-center w-5 h-5">
          @if (item.icon === 'whatsapp') {
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
          } @else if (item.icon === 'send') {
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          } @else if (item.icon === 'logs') {
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
          } @else if (item.icon === 'code') {
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
          }
        </span>

        <!-- Label -->
        @if (!isCollapsed()) {
          <span class="text-xs font-semibold tracking-tight truncate flex-1 min-w-0">
            {{ item.label }}
          </span>
        }
      </a>
    }
  </div>

  <!-- Bottom Drawer Collapse Toggle -->
  <div class="p-3 border-t border-slate-100 shrink-0">
    <button
      type="button"
      (click)="toggleCollapse.emit()"
      [matTooltip]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      matTooltipPosition="right"
      [title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      class="w-full flex items-center rounded-[10px] text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors cursor-pointer"
      [class.px-3]="!isCollapsed()"
      [class.py-2]="!isCollapsed()"
      [class.gap-2.5]="!isCollapsed()"
      [class.w-10]="isCollapsed()"
      [class.h-10]="isCollapsed()"
      [class.mx-auto]="isCollapsed()"
      [class.justify-center]="isCollapsed()"
    >
      <span class="shrink-0 flex items-center justify-center w-4 h-4">
        @if (isCollapsed()) {
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        } @else {
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        }
      </span>

      @if (!isCollapsed()) {
        <span class="text-xs font-medium text-slate-500 truncate">
          Collapse Menu
        </span>
      }
    </button>
  </div>
</aside>
